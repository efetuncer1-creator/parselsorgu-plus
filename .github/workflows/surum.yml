# Sürüm: "v0.1.0" gibi bir etiket gönderilince Windows'ta paket ve kurulum dosyası derlenir,
# GitHub Releases'a eklenir. Tanıtım sitesindeki indirme bağlantısı en son sürümü gösterir.
name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Not yoksa ya da taslaksa burada durur; paket derlenmez, sürüm yayınlanmaz.
      - name: Sürüm notu (site/guncellemeler.json)
        id: surum_notu
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/surum_notu.py "${{ github.ref_name }}" dist/surum-notu.md

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Düşen test olursa çıktının sonu uyarı olarak da yazılır: derleme kaydına giriş yapmadan da
      # (GitHub'ın açık API'sinden) okunabilsin.
      - name: Testler
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v 2>&1 | tee test-ciktisi.txt && exit 0
          # Hata ayrıntısı ("=====" ile başlayan bölüm); uyarı kutusu ~4000 harfle sınırlı
          ayrinti=$(sed -n '/^======/,$p' test-ciktisi.txt)
          [ -n "$ayrinti" ] || ayrinti=$(tail -c 3500 test-ciktisi.txt)
          ozet=$(printf '%s' "$ayrinti" | head -c 3500 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Testler başarısız::$ozet"
          exit 1

      # Uygulama kendi sürümünü bilsin: açılışta GitHub'daki son sürümle karşılaştırır. Elle çalıştırmada
      # (etiket yok) dosya olduğu gibi kalır; o derleme güncelleme denetlemez.
      - name: Sürüm numarası
        shell: pwsh
        run: |
          $surum = "${{ github.ref_name }}".TrimStart("v")
          if ($surum -match '^\d+\.\d+') { Set-Content -Path parselapp/surum.py -Value "SURUM = `"$surum`"" -Encoding utf8 }
          Get-Content parselapp/surum.py | Select-Object -Last 1

      - name: Paket (PyInstaller)
        run: pyinstaller packaging/ParselSorgu.spec --noconfirm

      - name: Pakette test ve veri klasörü olmadığını doğrula
        shell: pwsh
        run: |
          $yasak = Get-ChildItem dist/ParselSorguPlus -Recurse -Directory |
            Where-Object { $_.Name -in @("tests", "test-kml", "ornekler", "data") -or $_.Name -like "_gecici*" }
          if ($yasak) { $yasak | ForEach-Object { $_.FullName }; throw "Pakette test/veri klasörü var, kurulum dosyası üretilmedi." }
          "Pakette test/veri klasörü yok."

      - name: Kurulum dosyası (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $surum = "${{ github.ref_name }}".TrimStart("v")
          if (-not $surum -or $surum -notmatch '^\d') { $surum = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSurum=$surum" packaging\kurulum.iss

      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.surum_notu.outputs.baslik }}
          body_path: dist/surum-notu.md
          files: dist/ParselSorguPlus-Kurulum-*.exe

      - name: Derleme çıktısı (elle çalıştırmada)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: kurulum
          path: dist/ParselSorguPlus-Kurulum-*.exe
